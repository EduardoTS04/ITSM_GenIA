# Alembic configuration. Run every command from the backend/ directory.
# See backend/MIGRATIONS.md for the day-to-day commands.

[alembic]
# Path to the migration scripts, relative to this file.
script_location = %(here)s/alembic

# Lets env.py import the `app` package.
prepend_sys_path = .

path_separator = os

# No sqlalchemy.url here on purpose: alembic/env.py takes the URL from
# app.core.config.settings, so the app and the migrations can never disagree.
# Tests and one-off runs may still override it with -x or set_main_option().


[post_write_hooks]


# Logging configuration, consumed by alembic/env.py.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
